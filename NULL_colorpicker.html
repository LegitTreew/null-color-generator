<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NULL — nothing, yet something.</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;}
body{background:#7c5cff;color:#fff;transition:background-color .45s ease,color .25s ease;font-family:Arial,Helvetica,sans-serif;}
main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(24px,5vw,64px);}
header{line-height:1.35}
h1{margin:0;font-size:clamp(18px,2vw,26px);font-weight:700;letter-spacing:.02em}
p{margin:4px 0 0;font-size:13px;opacity:.8}
footer{display:flex;align-items:center;justify-content:flex-start}
button{border:1px solid currentColor;background:transparent;color:inherit;font:inherit;font-size:12px;letter-spacing:.08em;padding:12px 16px;cursor:pointer;transition:background .2s,transform .2s;}
button:hover{background:rgba(127,127,127,.13);transform:translateY(-1px)}
button:focus-visible{outline:2px solid currentColor;outline-offset:4px}
@media(prefers-reduced-motion:reduce){body,button{transition:none}}
</style>
</head>
<body>
<main>
<header><h1>NULL</h1><p>nothing, yet something.</p></header>
<footer><button id="random" type="button">GIVE ME A RANDOM COLOR</button></footer>
</main>
<script>
const button=document.getElementById('random');
function luminance(hex){const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;});return .2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];}
function generate(){let color='#'+Math.floor(Math.random()*0x1000000).toString(16).padStart(6,'0');document.body.style.backgroundColor=color;document.body.style.color=luminance(color)>.42?'#151515':'#f4f4f4';}
button.addEventListener('click',generate);
</script>
</body>
</html>
